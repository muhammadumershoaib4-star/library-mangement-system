<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>Library Management System</h1>
      <p>Simple HTML, CSS and JavaScript Project</p>
    </div>
  </header>

  <main class="container">
    <section class="stats">
      <div class="card"><h3>Total Books</h3><p id="totalBooks">0</p></div>
      <div class="card"><h3>Available</h3><p id="availableBooks">0</p></div>
      <div class="card"><h3>Issued</h3><p id="issuedBooks">0</p></div>
    </section>

    <section class="panel">
      <div class="section-heading">
        <h2>Add New Book</h2>
      </div>
      <form id="bookForm">
        <div class="form-grid">
          <input type="text" id="title" placeholder="Book title" required>
          <input type="text" id="author" placeholder="Author name" required>
          <input type="text" id="category" placeholder="Category" required>
          <input type="text" id="isbn" placeholder="ISBN" required>
        </div>
        <button type="submit">Add Book</button>
      </form>
    </section>

    <section class="panel">
      <div class="section-heading">
        <h2>Book List</h2>
        <input type="text" id="search" placeholder="Search books...">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Category</th>
              <th>ISBN</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="bookTable"></tbody>
        </table>
      </div>
      <p id="emptyMessage" class="empty">No books found.</p>
    </section>
  </main>

  <footer>
    <p>Library Management System | HTML • CSS • JavaScript</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
